# BoT-SORT + ReID tracker: keeps lost players alive and re-matches them by appearance
# when they reappear, reducing identity fragmentation during occlusions.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 150
match_thresh: 0.85
fuse_score: True
gmc_method: sparseOptFlow
proximity_thresh: 0.4
appearance_thresh: 0.35
with_reid: True
model: auto
